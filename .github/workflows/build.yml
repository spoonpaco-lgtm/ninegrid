name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ondertekeningssleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.NINEGRID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ninegrid.jks"
            echo "NINEGRID_KEYSTORE_PATH=$RUNNER_TEMP/ninegrid.jks" >> "$GITHUB_ENV"
            echo "Sleutel gevonden."
          else
            echo "Geen sleutel ingesteld: release wordt met de debug-sleutel ondertekend."
          fi

      - name: Bouwen en testen
        env:
          NINEGRID_KEYSTORE_PASSWORD: ${{ secrets.NINEGRID_KEYSTORE_PASSWORD }}
          NINEGRID_KEY_ALIAS: ${{ secrets.NINEGRID_KEY_ALIAS }}
          NINEGRID_KEY_PASSWORD: ${{ secrets.NINEGRID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log
          echo "ok" > status.txt

      - name: Status bij fout
        if: failure()
        run: echo "failed" > status.txt

      - name: APK als artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ninegrid-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Ondertekening controleren
        if: success()
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner|SHA256:" | head -2 | tee -a build.log

      - name: Release maken (nieuwe versionName op main)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER bestaat al." | tee -a build.log
          else
            cp app/build/outputs/apk/release/app-release.apk "NineGrid-$VER.apk"
            gh release create "$VER" "NineGrid-$VER.apk" --target "$GITHUB_SHA" \
              --title "NineGrid $VER" --notes-file RELEASE_NOTES.md
            echo "Release $VER gemaakt." | tee -a build.log
          fi

      - name: Bouwlog bewaren in branch ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci && cp build.log status.txt /tmp/ci/ 2>/dev/null || true
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log > /tmp/ci/errors.txt 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/ci/sha.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ci/* .
          git add -A
          git commit -m "Bouwlog ${GITHUB_SHA}" >/dev/null
          git push -f origin HEAD:ci-logs
