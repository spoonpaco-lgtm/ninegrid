name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ondertekeningssleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.NINEGRID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ninegrid.jks"
            echo "NINEGRID_KEYSTORE_PATH=$RUNNER_TEMP/ninegrid.jks" >> "$GITHUB_ENV"
            echo "Sleutel gevonden."
          else
            echo "Geen sleutel ingesteld: release wordt met de debug-sleutel ondertekend."
          fi

      - name: Namenlijst en setlijst van Scryfall in de app stoppen
        run: |
          mkdir -p app/src/main/assets
          UA="NineGridBuild/1.0 (+https://github.com/spoonpaco-lgtm/ninegrid)"
          curl -sSf -A "$UA" -H "Accept: application/json" https://api.scryfall.com/catalog/card-names -o app/src/main/assets/card-names.json || echo "Namenlijst niet gelukt"
          sleep 1
          curl -sSf -A "$UA" -H "Accept: application/json" https://api.scryfall.com/sets -o app/src/main/assets/sets.json || echo "Setlijst niet gelukt"
          ls -la app/src/main/assets | tee -a build.log

      - name: Bouwen en testen
        env:
          NINEGRID_KEYSTORE_PASSWORD: ${{ secrets.NINEGRID_KEYSTORE_PASSWORD }}
          NINEGRID_KEY_ALIAS: ${{ secrets.NINEGRID_KEY_ALIAS }}
          NINEGRID_KEY_PASSWORD: ${{ secrets.NINEGRID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log
          echo "ok" > status.txt

      - name: Status bij fout
        if: failure()
        run: echo "failed" > status.txt

      - name: APK als artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ninegrid-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Ondertekening controleren
        if: success()
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN:|SHA-256" | head -2 | tee -a build.log || true

      - name: Release maken (nieuwe versionName op main)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(sed -n 's/^val versionNameValue = "\(.*\)"/\1/p' app/build.gradle.kts)"
          CODENAME="$(sed -n 's/^val versionCodenameValue = "\(.*\)"/\1/p' app/build.gradle.kts)"
          TITLE="NineGrid $VER${CODENAME:+ – $CODENAME}"
          echo "Versie: $TITLE" | tee -a build.log
          set -o pipefail
          cp app/build/outputs/apk/release/app-release.apk "NineGrid-$VER.apk"
          if gh release view "$VER" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$VER" --json isDraft --jq .isDraft)
            HAS_APK=$(gh release view "$VER" --json assets --jq "[.assets[].name] | index(\"NineGrid-$VER.apk\") != null")
            if [ "$IS_DRAFT" = "true" ] || [ "$HAS_APK" != "true" ]; then
              # Half gelukte release (bijv. door een storing bij GitHub): APK opnieuw erbij en publiceren.
              gh release upload "$VER" "NineGrid-$VER.apk" --clobber 2>&1 | tee -a build.log
              gh release edit "$VER" --draft=false --title "$TITLE" --notes-file RELEASE_NOTES.md 2>&1 | tee -a build.log
              echo "Release $VER hersteld." | tee -a build.log
            else
              echo "Release $VER bestaat al." | tee -a build.log
            fi
          else
            gh release create "$VER" "NineGrid-$VER.apk" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file RELEASE_NOTES.md 2>&1 | tee -a build.log
            echo "Release $VER gemaakt." | tee -a build.log
          fi

      - name: Bouwlog bewaren in branch ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci && cp build.log status.txt /tmp/ci/ 2>/dev/null || true
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log > /tmp/ci/errors.txt 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/ci/sha.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ci/* .
          git add -A
          git commit -m "Bouwlog ${GITHUB_SHA}" >/dev/null
          git push -f origin HEAD:ci-logs
