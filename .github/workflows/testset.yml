name: Scanner-testset

# Alleen op verzoek (Actions → Scanner-testset → Run workflow). Raakt de gewone bouw en release niet.
on:
  workflow_dispatch:

jobs:
  testset:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: KVM aanzetten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testset draaien op de emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest 2>&1 | tee testset.log || true
            adb logcat -d -s TESTSET:I > logcat.txt || true
            adb shell 'cat /sdcard/Android/data/nl.spoonpaco.ninegrid.test/files/testset-uitslag.txt' > testset-uitslag.txt || true

      - name: Uitslag in de samenvatting
        if: always()
        run: |
          { echo '## Scanner-testset'; echo '```'; cat testset-uitslag.txt 2>/dev/null || tail -60 logcat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testset-uitslag
          path: |
            testset-uitslag.txt
            logcat.txt
            testset.log
